<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pembayaran - Admin Toko Baju Online</title>
    <link rel="stylesheet" href="Assets/css/global.css">
    <link rel="stylesheet" href="Assets/css/admin/payments.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="header-container"></div>
        
        <div class="payments-container">
            <div class="page-header">
                <h1>Kelola Pembayaran</h1>
                <div class="summary-stats">
                    <div class="stat">Total Transaksi: <span id="totalTransactions">0</span></div>
                    <div class="stat">Pending: <span id="pendingPayments">0</span></div>
                    <div class="stat">Success: <span id="successPayments">0</span></div>
                </div>
            </div>
            
            <div class="payment-methods">
                <h2>Metode Pembayaran Aktif</h2>
                <div class="methods-grid">
                    <div class="method-card">
                        <i class="fas fa-university"></i>
                        <h3>Transfer Bank</h3>
                        <p>BCA, Mandiri, BNI, BRI</p>
                        <label class="toggle-switch">
                            <input type="checkbox" checked disabled>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="method-card">
                        <i class="fas fa-credit-card"></i>
                        <h3>Kartu Kredit</h3>
                        <p>Visa, Mastercard</p>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="method-card">
                        <i class="fas fa-mobile-alt"></i>
                        <h3>E-Wallet</h3>
                        <p>OVO, GoPay, Dana</p>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="method-card">
                        <i class="fas fa-truck"></i>
                        <h3>COD</h3>
                        <p>Bayar di Tempat</p>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="transaction-history">
                <h2>Riwayat Transaksi</h2>
                <div class="filters">
                    <input type="text" id="searchTransaction" placeholder="Cari transaksi...">
                    <select id="statusFilter">
                        <option value="all">Semua Status</option>
                        <option value="pending">Pending</option>
                        <option value="paid">Paid</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="data-table" id="transactionsTable">
                        <thead>
                            <tr><th>ID Transaksi</th><th>Order ID</th><th>Pelanggan</th><th>Metode</th><th>Jumlah</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr>
                        </thead>
                        <tbody id="transactionsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="footer-container"></div>
    </div>
    
    <script>
        function loadTransactions() {
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            const searchTerm = document.getElementById('searchTransaction').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            let transactions = orders.map(order => ({
                id: 'TRX-' + order.orderId,
                orderId: order.orderId,
                customer: order.shipping?.receiverName || 'Customer',
                method: order.paymentMethod || 'Transfer Bank',
                amount: order.total || 0,
                status: order.paymentStatus || 'pending',
                date: order.date
            }));
            
            if(statusFilter !== 'all') {
                transactions = transactions.filter(t => t.status === statusFilter);
            }
            if(searchTerm) {
                transactions = transactions.filter(t => 
                    t.orderId.toLowerCase().includes(searchTerm) || 
                    t.customer.toLowerCase().includes(searchTerm)
                );
            }
            
            const total = transactions.length;
            const pending = transactions.filter(t => t.status === 'pending').length;
            const paid = transactions.filter(t => t.status === 'paid').length;
            
            document.getElementById('totalTransactions').textContent = total;
            document.getElementById('pendingPayments').textContent = pending;
            document.getElementById('successPayments').textContent = paid;
            
            const tbody = document.getElementById('transactionsBody');
            tbody.innerHTML = transactions.map(t => `
                <tr>
                    <td>${t.id}</td>
                    <td>${t.orderId}</td>
                    <td>${t.customer}</td>
                    <td>${t.method}</td>
                    <td>Rp ${t.amount.toLocaleString()}</td>
                    <td><span class="status-badge ${t.status}">${t.status}</span></td>
                    <td>${new Date(t.date).toLocaleDateString()}</td>
                    <td>
                        <button onclick="viewTransaction('${t.orderId}')" class="btn-sm">Detail</button>
                        ${t.status === 'pending' ? `<button onclick="confirmPayment('${t.orderId}')" class="btn-sm btn-success">Konfirmasi</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }
        
        function viewTransaction(orderId) {
            alert(`Detail transaksi untuk order ${orderId}`);
        }
        
        function confirmPayment(orderId) {
            if(confirm(`Konfirmasi pembayaran untuk order ${orderId}?`)) {
                const orders = JSON.parse(localStorage.getItem('orders')) || [];
                const order = orders.find(o => o.orderId === orderId);
                if(order) {
                    order.paymentStatus = 'paid';
                    order.orderStatus = 'processing';
                    localStorage.setItem('orders', JSON.stringify(orders));
                    alert('Pembayaran dikonfirmasi!');
                    loadTransactions();
                }
            }
        }
        
        document.getElementById('searchTransaction').addEventListener('input', loadTransactions);
        document.getElementById('statusFilter').addEventListener('change', loadTransactions);
        
        // Load components
        Promise.all([
            fetch('Components/sidebar-admin.html').then(res => res.text()),
            fetch('Components/header.html').then(res => res.text()),
            fetch('Components/footer.html').then(res => res.text())
        ]).then(([sidebar, header, footer]) => {
            document.getElementById('sidebar-container').innerHTML = sidebar;
            document.getElementById('header-container').innerHTML = header;
            document.getElementById('footer-container').innerHTML = footer;
            loadTransactions();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan - Admin Toko Baju Online</title>
    <link rel="stylesheet" href="../../assets/css/global/global.css">
    <link rel="stylesheet" href="../../assets/css/admin/reports.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="header-container"></div>
        
        <div class="reports-container">
            <div class="page-header">
                <h1>Laporan & Analitik</h1>
                <button onclick="exportReport()" class="btn-primary"><i class="fas fa-download"></i> Export Laporan</button>
            </div>
            
            <div class="report-filters">
                <label>Periode Laporan:</label>
                <select id="reportPeriod">
                    <option value="daily">Harian</option>
                    <option value="weekly">Mingguan</option>
                    <option value="monthly" selected>Bulanan</option>
                    <option value="yearly">Tahunan</option>
                </select>
                <input type="month" id="reportMonth" value="2024-01">
                <button onclick="generateReport()" class="btn-secondary">Generate</button>
            </div>
            
            <div class="report-summary">
                <div class="summary-card">
                    <h3>Total Pendapatan</h3>
                    <p id="totalRevenue">Rp 0</p>
                </div>
                <div class="summary-card">
                    <h3>Total Pesanan</h3>
                    <p id="totalOrders">0</p>
                </div>
                <div class="summary-card">
                    <h3>Rata-rata Order</h3>
                    <p id="avgOrder">Rp 0</p>
                </div>
                <div class="summary-card">
                    <h3>Produk Terlaris</h3>
                    <p id="topProduct">-</p>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="revenueChart"></canvas>
            </div>
            
            <div class="top-products">
                <h2>Produk Terlaris</h2>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr><th>Rank</th><th>Nama Produk</th><th>Terjual</th><th>Pendapatan</th></tr>
                        </thead>
                        <tbody id="topProductsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="footer-container"></div>
    </div>
    
    <script>
        function generateReport() {
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            const period = document.getElementById('reportPeriod').value;
            const month = document.getElementById('reportMonth').value;
            
            // Filter berdasarkan periode
            let filteredOrders = orders;
            if(period === 'monthly' && month) {
                filteredOrders = orders.filter(o => o.date.startsWith(month));
            }
            
            const totalRevenue = filteredOrders.reduce((sum, o) => sum + (o.total || 0), 0);
            const totalOrders = filteredOrders.length;
            const avgOrder = totalOrders > 0 ? totalRevenue / totalOrders : 0;
            
            document.getElementById('totalRevenue').textContent = `Rp ${totalRevenue.toLocaleString()}`;
            document.getElementById('totalOrders').textContent = totalOrders;
            document.getElementById('avgOrder').textContent = `Rp ${avgOrder.toLocaleString()}`;
            
            // Analisis produk terlaris (simulasi)
            const topProducts = [
                {name: 'Kaos Polos Premium', sold: 45, revenue: 6750000},
                {name: 'Kemeja Flanel Pria', sold: 32, revenue: 8000000},
                {name: 'Dress Wanita Elegan', sold: 28, revenue: 9800000},
                {name: 'Jaket Denim', sold: 20, revenue: 9000000}
            ];
            
            document.getElementById('topProduct').textContent = topProducts[0].name;
            
            const topProductsBody = document.getElementById('topProductsBody');
            topProductsBody.innerHTML = topProducts.map((p, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${p.name}</td>
                    <td>${p.sold} pcs</td>
                    <td>Rp ${p.revenue.toLocaleString()}</td>
                </tr>
            `).join('');
            
            // Chart
            const ctx = document.getElementById('revenueChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Minggu 1', 'Minggu 2', 'Minggu 3', 'Minggu 4'],
                    datasets: [{
                        label: 'Pendapatan (Rp)',
                        data: [5000000, 7500000, 8200000, 6800000],
                        backgroundColor: '#4F46E5'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }
        
        function exportReport() {
            alert('Laporan akan diekspor dalam format CSV');
        }
        
        // Load components
        Promise.all([
            fetch('../../components/sidebar-admin.html').then(res => res.text()),
            fetch('../../components/header.html').then(res => res.text()),
            fetch('../../components/footer.html').then(res => res.text())
        ]).then(([sidebar, header, footer]) => {
            document.getElementById('sidebar-container').innerHTML = sidebar;
            document.getElementById('header-container').innerHTML = header;
            document.getElementById('footer-container').innerHTML = footer;
            generateReport();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Admin - Toko Baju Online</title>
    <link rel="stylesheet" href="../../Assets/css/global.css">
    <link rel="stylesheet" href="../../Assets/css/admin/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="header-container"></div>
        
        <div class="profile-container">
            <div class="page-header">
                <h1>Profil Admin</h1>
            </div>
            
            <div class="profile-layout">
                <div class="profile-avatar-section">
                    <div class="avatar">
                        <i class="fas fa-user-shield fa-4x"></i>
                    </div>
                    <h2 id="adminName">Admin</h2>
                    <p class="admin-role">Administrator</p>
                </div>
                
                <div class="profile-form-section">
                    <form id="adminProfileForm">
                        <div class="form-group">
                            <label for="fullname">Nama Lengkap</label>
                            <input type="text" id="fullname" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">No. Telepon</label>
                            <input type="tel" id="phone">
                        </div>
                        <div class="form-group">
                            <label for="storeName">Nama Toko</label>
                            <input type="text" id="storeName" value="Toko Baju Online">
                        </div>
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Simpan Perubahan</button>
                    </form>
                    
                    <div class="change-password-section">
                        <h3>Ubah Password</h3>
                        <form id="changePasswordForm">
                            <div class="form-group">
                                <label>Password Lama</label>
                                <input type="password" id="oldPassword" required>
                            </div>
                            <div class="form-group">
                                <label>Password Baru</label>
                                <input type="password" id="newPassword" required>
                            </div>
                            <div class="form-group">
                                <label>Konfirmasi Password Baru</label>
                                <input type="password" id="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn-secondary">Ubah Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="footer-container"></div>
    </div>
    
    <script>
        // Load admin data
        function loadAdminData() {
            const adminUsername = localStorage.getItem('adminUsername') || 'Admin';
            document.getElementById('adminName').textContent = adminUsername;
            
            // Load saved profile data
            const savedProfile = JSON.parse(localStorage.getItem('adminProfile')) || {
                fullname: 'Administrator Toko',
                email: 'admin@tokobaju.com',
                phone: '081234567890',
                storeName: 'Toko Baju Online'
            };
            
            document.getElementById('fullname').value = savedProfile.fullname;
            document.getElementById('email').value = savedProfile.email;
            document.getElementById('phone').value = savedProfile.phone;
            document.getElementById('storeName').value = savedProfile.storeName;
        }
        
        // Save profile
        document.getElementById('adminProfileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const profileData = {
                fullname: document.getElementById('fullname').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                storeName: document.getElementById('storeName').value
            };
            
            localStorage.setItem('adminProfile', JSON.stringify(profileData));
            alert('Profil berhasil diperbarui!');
        });
        
        // Change password
        document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if(newPassword !== confirmPassword) {
                alert('Password baru tidak cocok!');
                return;
            }
            
            if(newPassword.length < 6) {
                alert('Password minimal 6 karakter!');
                return;
            }
            
            // Simulasi validasi password lama
            if(oldPassword !== 'admin123') {
                alert('Password lama salah!');
                return;
            }
            
            alert('Password berhasil diubah! Silakan login kembali.');
            localStorage.removeItem('adminLoggedIn');
            window.location.href = '../../Frondend/Admin/login.html';
        });
        
        // Load components
        Promise.all([
            fetch('../../Components/sidebar-admin.html').then(res => res.text()),
            fetch('../../Components/header.html').then(res => res.text()),
            fetch('../../Components/footer.html').then(res => res.text())
        ]).then(([sidebar, header, footer]) => {
            document.getElementById('sidebar-container').innerHTML = sidebar;
            document.getElementById('header-container').innerHTML = header;
            document.getElementById('footer-container').innerHTML = footer;
            loadAdminData();
        });
    </script>
</body>
</html>

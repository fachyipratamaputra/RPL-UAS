<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - Toko Baju Online</title>
    <link rel="stylesheet" href="../../Assets/css/global.css">
    <link rel="stylesheet" href="../../Assets/css/customers/products.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="header-container"></div>
    <div id="navbar-container"></div>

    <main class="products-main">
        <div class="container">
            <div class="products-layout">
                <aside class="filters-sidebar">
                    <h3>Filter & Urutkan</h3>

                    <div class="filter-group">
                        <label for="categoryFilter">Kategori</label>
                        <select id="categoryFilter">
                            <option value="all">Semua</option>
                            <option value="atasan">Atasan</option>
                            <option value="bawahan">Bawahan</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="sortBy">Urutkan</label>
                        <select id="sortBy">
                            <option value="default">Bawaan</option>
                            <option value="price_asc">Termurah</option>
                            <option value="price_desc">Termahal</option>
                            <option value="name_asc">Nama A-Z</option>
                        </select>
                    </div>
                </aside>

                <div class="products-content">
                    <div class="products-header">
                        <h2>Semua Produk</h2>
                    </div>
                    <div class="products-grid" id="productsGrid"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let originalProducts = [];
        let currentProducts = [];

        // Ambil data produk dari backend
        async function fetchAllProducts() {
            try {
                const response = await fetch(`${API_URL}/produk`);
                if (!response.ok) throw new Error('Gagal merespon API');

                const results = await response.json();
                originalProducts = results;
                currentProducts = [...originalProducts];

                renderProducts();
            } catch (error) {
                console.error('Gagal mengambil data produk dari database:', error);
                document.getElementById('productsGrid').innerHTML = `
                    <div style="text-align: center; grid-column: 1/-1; padding: 30px; color: #ef4444;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2em; margin-bottom: 10px;"></i>
                        <p>Gagal memuat produk dari database. Pastikan server backend Node.js Anda berjalan.</p>
                    </div>`;
            }
        }

        // Render komponen kartu produk ke HTML
        function renderProducts() {
            const grid = document.getElementById('productsGrid');

            if (currentProducts.length === 0) {
                grid.innerHTML = '<div style="text-align: center; grid-column: 1/-1; padding: 20px;">Produk tidak ditemukan.</div>';
                return;
            }

            grid.innerHTML = currentProducts.map(product => {
                const hargaAsli = product.harga;
                const diskonPersen = product.diskon || 0;
                const hargaFinal = diskonPersen > 0 ? hargaAsli - (hargaAsli * diskonPersen / 100) : hargaAsli;
                const gambarProduk = product.gambar || 'https://placehold.co/300x400?text=No+Image';

                return `
                <div class="product-card">
                    ${diskonPersen > 0 ? `<div class="product-badge">-${diskonPersen}%</div>` : ''}
                    <img src="${gambarProduk}" alt="${product.nama_produk}">
                    <div class="product-info">
                        <h3 class="product-title">${product.nama_produk}</h3>
                        <div class="product-price">
                            <p class="price">Rp ${hargaFinal.toLocaleString('id-ID')}</p>
                            ${diskonPersen > 0 ? `<p class="old-price">Rp ${hargaAsli.toLocaleString('id-ID')}</p>` : ''}
                        </div>
                        <div class="product-actions">
                            <button onclick="tambahKeKeranjangDatabase('${product.id_product}', 1)">
                                <i class="fas fa-cart-plus"></i> Beli
                            </button>
                            <a href="product-detail.html?id=${product.id_product}">Detail</a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Mengirimkan item baru ke tabel cart_items di database
        function tambahKeKeranjangDatabase(idProduct, jumlahDipilih) {
            const token = localStorage.getItem('token');

            if (!token) {
                alert("Silakan login terlebih dahulu untuk menambah keranjang!");
                window.location.href = "../../Frondend/Customers/login.html";
                return;
            }

            fetch(`${API_URL}/cart/add`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    id_product: idProduct,
                    jumlah: jumlahDipilih
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert("Gagal memasukkan keranjang: " + data.error);
                } else {
                    alert("Produk berhasil dimasukkan ke keranjang!");
                    updateVisualBadgeLokal(jumlahDipilih);
                }
            })
            .catch(err => console.error("Error saat add to cart:", err));
        }

        // Perbarui visual counter merah di komponen navbar secara dinamis
        function updateVisualBadgeLokal(jumlahDitambahkan) {
            const cartCountElements = document.querySelectorAll('.cart-count');
            
            cartCountElements.forEach(el => {
                if (el) {
                    let currentCount = parseInt(el.textContent) || 0;
                    let newCount = currentCount + parseInt(jumlahDitambahkan);
                    el.textContent = newCount;
                    el.style.display = newCount === 0 ? 'none' : 'flex';
                }
            });
        }

        // Filter kategori dan pengurutan harga/nama
        function applyFilterAndSort() {
            const categoryValue = document.getElementById('categoryFilter').value.toLowerCase();
            const sortValue = document.getElementById('sortBy').value;

            if (categoryValue === 'all') {
                currentProducts = [...originalProducts];
            } else {
                currentProducts = originalProducts.filter(p => p.kategori && p.kategori.toLowerCase() === categoryValue);
            }

            if (sortValue === 'price_asc') currentProducts.sort((a, b) => a.harga - b.harga);
            if (sortValue === 'price_desc') currentProducts.sort((a, b) => b.harga - a.harga);
            if (sortValue === 'name_asc') currentProducts.sort((a, b) => a.nama_produk.localeCompare(b.nama_produk));

            renderProducts();
        }

        document.getElementById('categoryFilter').addEventListener('change', applyFilterAndSort);
        document.getElementById('sortBy').addEventListener('change', applyFilterAndSort);

        // Memuat template komponen eksternal secara asinkronus
        document.addEventListener('DOMContentLoaded', function () {
            Promise.all([
                fetch('../../Components/header.html').then(res => res.text()).catch(() => ''),
                fetch('../../Components/navbar.html').then(res => res.text()).catch(() => ''),
                fetch('../../Components/footer.html').then(res => res.text()).catch(() => '')
            ]).then(([header, navbar, footer]) => {
                if (document.getElementById('header-container')) document.getElementById('header-container').innerHTML = header;
                if (document.getElementById('navbar-container')) document.getElementById('navbar-container').innerHTML = navbar;
                if (document.getElementById('footer-container')) document.getElementById('footer-container').innerHTML = footer;

                fetchAllProducts();
            });
        });
    </script>
</body>

</html>

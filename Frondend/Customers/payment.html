<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran - Toko Baju Online</title>
    <link rel="stylesheet" href="../../Assets/css/global.css">
    <link rel="stylesheet" href="../../Assets/css/customers/payment.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="header-container"></div>
    <div id="navbar-container"></div>

    <main class="payment-main">
        <div class="container">
            <h1>Pembayaran</h1>
            <div class="payment-layout">
                <div class="payment-methods">
                    <h3>Metode Pembayaran</h3>
                    <div class="payment-options">
                        <label class="payment-option">
                            <input type="radio" name="payment" value="bank_transfer" checked>
                            <div>
                                <i class="fas fa-university"></i>
                                <strong>Transfer Bank</strong>
                                <span>BCA, Mandiri, BNI, BRI</span>
                            </div>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="credit_card">
                            <div>
                                <i class="fas fa-credit-card"></i>
                                <strong>Kartu Kredit</strong>
                                <span>Visa, Mastercard</span>
                            </div>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="ewallet">
                            <div>
                                <i class="fas fa-mobile-alt"></i>
                                <strong>E-Wallet</strong>
                                <span>OVO, GoPay, Dana, ShopeePay</span>
                            </div>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="cod">
                            <div>
                                <i class="fas fa-truck"></i>
                                <strong>COD (Bayar di Tempat)</strong>
                                <span>Bayar saat barang diterima</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="payment-summary" id="paymentSummary"></div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        const products = {
            1: { name: 'Kaos Polos Premium', price: 150000 },
            2: { name: 'Kemeja Flanel Pria', price: 250000 },
            3: { name: 'Dress Wanita Elegan', price: 350000 },
            4: { name: 'Jaket Denim', price: 450000 }
        };

        function loadPaymentSummary() {
            const currentOrder = JSON.parse(localStorage.getItem('currentOrder'));

            if (!currentOrder) {
                document.getElementById('paymentSummary').innerHTML = '<p>Tidak ada data pesanan aktif.</p>';
                return;
            }

            let itemsHTML = '';

            // Loop langsung memakai data item asli yang di-pass dari cart & checkout
            if (currentOrder.items && currentOrder.items.length > 0) {
                currentOrder.items.forEach(item => {
                    const harga = Number(item.harga) || 0;
                    const diskon = Number(item.diskon) || 0;
                    const qty = Number(item.kuantitas || item.quantity) || 1;
                    const hargaFinal = diskon > 0 ? harga * (1 - diskon / 100) : harga;
                    const itemTotal = hargaFinal * qty;

                    itemsHTML += `
            <div class="order-item">
                <span>${item.nama_produk} x ${qty}</span>
                <span>Rp ${itemTotal.toLocaleString('id-ID')}</span>
            </div>`;
                });
            }

            const subtotal = currentOrder.subtotal || 0;
            const ongkir = currentOrder.ongkir || 0;
            const total = currentOrder.total || 0;

            document.getElementById('paymentSummary').innerHTML = `
        <div class="summary-card">
            <h3>Ringkasan Pembayaran</h3>
            <div class="order-items">${itemsHTML}</div>
            <div class="summary-row">
                <span>Subtotal</span>
                <span>Rp ${subtotal.toLocaleString('id-ID')}</span>
            </div>
            <div class="summary-row">
                <span>Ongkos Kirim</span>
                <span>Rp ${ongkir.toLocaleString('id-ID')}</span>
            </div>
            <div class="summary-row total">
                <span>Total yang harus dibayar</span>
                <span>Rp ${total.toLocaleString('id-ID')}</span>
            </div>
            <button class="btn-pay" onclick="processPayment()">Bayar Sekarang</button>
        </div>
    `;
        }

        function processPayment() {
            const selectedPaymentElement = document.querySelector('input[name="payment"]:checked');
            if (!selectedPaymentElement) {
                alert('Pilih metode pembayaran terlebih dahulu!');
                return;
            }

            const selectedPayment = selectedPaymentElement.value;
            let paymentMethod = '';

            switch (selectedPayment) {
                case 'bank_transfer': paymentMethod = 'Transfer Bank'; break;
                case 'credit_card': paymentMethod = 'Kartu Kredit'; break;
                case 'ewallet': paymentMethod = 'E-Wallet'; break;
                case 'cod': paymentMethod = 'COD'; break;
            }

            const currentOrder = JSON.parse(localStorage.getItem('currentOrder'));
            if (currentOrder) {
                currentOrder.paymentMethod = paymentMethod;
                currentOrder.paymentStatus = 'paid';
                currentOrder.orderStatus = 'processing';

                let orders = JSON.parse(localStorage.getItem('orders')) || [];
                orders.push(currentOrder);

                localStorage.setItem('orders', JSON.stringify(orders));
                localStorage.removeItem('currentOrder');
                localStorage.removeItem('cart'); // Bersihkan keranjang local setelah bayar
            }

            alert(`Pembayaran dengan ${paymentMethod} berhasil!`);
            window.location.href = 'order-history.html';
        }

        // Menggandeng pemuatan komponen navbar & data summary secara bersamaan
        document.addEventListener('DOMContentLoaded', () => {
            Promise.all([
                fetch('../../Components/header.html').then(res => res.text()).catch(() => ''),
                fetch('../../Components/navbar.html').then(res => res.text()).catch(() => ''),
                fetch('../../Components/footer.html').then(res => res.text()).catch(() => '')
            ]).then(([header, navbar, footer]) => {
                if (header) document.getElementById('header-container').innerHTML = header;
                if (navbar) document.getElementById('navbar-container').innerHTML = navbar;
                if (footer) document.getElementById('footer-container').innerHTML = footer;

                loadPaymentSummary();
            });
        });

        // Load components
        Promise.all([
            fetch('../../Components/header.html').then(res => res.text()),
            fetch('../../Components/navbar.html').then(res => res.text()),
            fetch('../../Components/footer.html').then(res => res.text())
        ]).then(([header, navbar, footer]) => {
            document.getElementById('header-container').innerHTML = header;
            document.getElementById('navbar-container').innerHTML = navbar;
            document.getElementById('footer-container').innerHTML = footer;
            loadPaymentSummary();
            // Di script payment.html
            document.addEventListener('DOMContentLoaded', () => {
                const finalTotal = localStorage.getItem('finalTotal');
                const subtotal = localStorage.getItem('subtotal');

                // Tampilkan di Ringkasan Pembayaran
                document.getElementById('displaySubtotal').innerText = `Rp ${parseInt(subtotal).toLocaleString()}`;
                document.getElementById('displayTotalBayar').innerText = `Rp ${parseInt(finalTotal).toLocaleString()}`;
            });
        });
    </script>
</body>

</html>

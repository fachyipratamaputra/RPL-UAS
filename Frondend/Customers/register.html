<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Toko Baju Online</title>
    <link rel="stylesheet" href="../../Assets/css/global.css">
    <link rel="stylesheet" href="../../Assets/css/customers/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-container"></div>
    
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Daftar Akun</h2>
                <p>Bergabung dan dapatkan diskon menarik</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="fullname">Nama Lengkap</label>
                    <input type="text" id="fullname" required placeholder="Masukkan nama lengkap">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Masukkan email">
                </div>
                
                <div class="form-group">
                    <label for="phone">No. Telepon</label>
                    <input type="tel" id="phone" required placeholder="Masukkan no. telepon">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Buat password">
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Konfirmasi Password</label>
                    <input type="password" id="confirm-password" required placeholder="Konfirmasi password">
                </div>
                
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="terms" required> Saya setuju dengan <a href="#">Syarat & Ketentuan</a>
                    </label>
                </div>
                
                <button type="submit" class="btn-register">Daftar</button>
            </form>
            
            <div class="auth-footer">
                <p>Sudah punya akun? <a href="../../Frondend/Customers/login.html">Login Sekarang</a></p>
            </div>
        </div>
    </div>
    
    <div id="footer-container"></div>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const terms = document.getElementById('terms').checked;
            
            if(password !== confirmPassword) {
                alert('Password tidak sesuai!');
                return;
            }
            
            if(!terms) {
                alert('Harap setuju dengan syarat & ketentuan!');
                return;
            }
            
            // Simulasi registrasi
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userFullname', fullname);
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPhone', phone);
            
            alert('Registrasi berhasil! Silakan login.');
            window.location.href = '../../Frondend/Customers/login.html';
        });
        
        fetch('../../Assets/Components/header.html')
            .then(res => res.text())
            .then(data => document.getElementById('header-container').innerHTML = data);
        fetch('../../Assets/Components/footer.html')
            .then(res => res.text())
            .then(data => document.getElementById('footer-container').innerHTML = data);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pesanan - Toko Baju Online</title>
    <link rel="stylesheet" href="../../Assets/css/global.css">
    <link rel="stylesheet" href="../../Assets/css/customers/order-history.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="header-container"></div>
    <div id="navbar-container"></div>

    <main class="history-main">
        <div class="container">
            <h1>Riwayat Pesanan</h1>
            <div id="ordersList" class="orders-list"></div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        // PERBAIKAN: Membaca base path rute transaksi dengan benar
        const API_URL = 'http://localhost:5000/api/transaksi';

        // Fungsi utama mengambil riwayat pesanan nyata dari database backend
        async function loadOrders() {
            const token = localStorage.getItem('token');
            const container = document.getElementById('ordersList');
            console.log("Token yang ditemukan di browser:", token);

            if (!token) {
                alert('Silakan login terlebih dahulu untuk melihat riwayat pesanan.');
                window.location.href = 'login.html';
                return;
            }

            try {
                // PERBAIKAN: Mengarah langsung ke ${API_URL}/history -> http://localhost:5000/api/transaksi/history
                const response = await fetch(`${API_URL}/history`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Gagal mengambil data riwayat pesanan');

                const orders = await response.json();

                if (!orders || orders.length === 0) {
                    container.innerHTML = `
                    <div class="empty-orders" style="text-align: center; padding: 40px;">
                        <i class="fas fa-box-open" style="font-size: 3em; color: #ccc;"></i>
                        <p style="margin-top: 15px;">Belum ada pesanan</p>
                        <a href="products.html" class="btn-primary" style="display:inline-block; margin-top:10px; padding: 8px 16px; background:#4F46E5; color:white; border-radius:5px; text-decoration:none;">Mulai Belanja</a>
                    </div>`;
                    return;
                }

                // Render card list pesanan dari database
                container.innerHTML = orders.map(order => {
                    let itemsHTML = '';

                    // Memastikan data item belanjaan dari database terbaca
                    if (order.items && order.items.length > 0) {
                        order.items.forEach(item => {
                            itemsHTML += `<li>${item.nama_produk} x ${item.jumlah} = Rp ${Number(item.subtotal).toLocaleString('id-ID')}</li>`;
                        });
                    } else {
                        itemsHTML = `<li>Detail produk tidak tersedia</li>`;
                    }

                    const currentStatus = order.status_order || 'processing';

                    return `
                    <div class="order-card" style="border: 1px solid #eee; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fff;">
                        <div class="order-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                            <div>
                                <h3 style="margin: 0; color: #333;">ID Order: #${order.id_order}</h3>
                                <p style="margin: 5px 0 0 0; color: #888; font-size: 0.9em;">${new Date(order.tanggal_order || order.date).toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                            </div>
                            <div class="order-status ${currentStatus}" style="padding: 5px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold;">
                                ${getStatusText(currentStatus)}
                            </div>
                        </div>
                        <div class="order-body" style="padding: 15px 0;">
                            <div class="order-items">
                                <ul style="padding-left: 20px; margin: 0; color: #555;">${itemsHTML}</ul>
                            </div>
                            <div class="order-total" style="margin-top: 15px; font-size: 1.1em;">
                                <strong>Total Akhir: Rp ${Number(order.total_harga).toLocaleString('id-ID')}</strong>
                            </div>
                            <div class="order-payment" style="margin-top: 5px; color: #666; font-size: 0.9em;">
                                <span>Metode Pembayaran: <strong>${order.metode_pembayaran || order.metode || 'Transfer Bank'}</strong></span>
                            </div>
                        </div>
                        <div class="order-footer" style="border-top: 1px solid #eee; padding-top: 15px; display: flex; gap: 10px;">
                            <button onclick="trackOrder('${order.id_order}')" class="btn-track" style="padding: 8px 15px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 5px; cursor: pointer;">Lacak Pesanan</button>
                            <button onclick="reorder(${order.id_order})" class="btn-reorder" style="padding: 8px 15px; background: #4F46E5; color: white; border: none; border-radius: 5px; cursor: pointer;">Pesan Lagi</button>
                        </div>
                    </div>
                `;
                }).join('');

            } catch (error) {
                console.error(error);
                container.innerHTML = '<p style="text-align:center; color:red; padding: 20px;">Gagal memuat riwayat pesanan dari server.</p>';
            }
        }

        function getStatusText(status) {
            const statusMap = {
                'pending': 'Menunggu Pembayaran',
                'processing': 'Diproses',
                'shipped': 'Dikirim',
                'delivered': 'Selesai',
                'cancelled': 'Dibatalkan'
            };
            return statusMap[status] || status;
        }

        function trackOrder(orderId) {
            alert(`Tracking pesanan #${orderId}: Pesanan Anda sedang diproses dan dikemas di gudang.`);
        }

        async function reorder(orderId) {
            alert(`Fitur menyalin pesanan #${orderId} ke keranjang aktif.`);
            window.location.href = 'cart.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            Promise.all([
                fetch('../../Components/header.html').then(res => res.text()).catch(() => ''),
                fetch('../../Components/navbar.html').then(res => res.text()).catch(() => ''),
                fetch('../../Components/footer.html').then(res => res.text()).catch(() => '')
            ]).then(([header, navbar, footer]) => {
                if (header) document.getElementById('header-container').innerHTML = header;
                if (navbar) document.getElementById('navbar-container').innerHTML = navbar;
                if (footer) document.getElementById('footer-container').innerHTML = footer;

                loadOrders();
            });
        });
    </script>
</body>

</html>
